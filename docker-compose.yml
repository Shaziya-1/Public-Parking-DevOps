version: '3.8'

services:
  # ParkWatch Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: parkwatch:latest
    container_name: parkwatch-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=8080
      - LOW_AVAILABILITY_THRESHOLD=85
      - STALE_THRESHOLD_MINUTES=60
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - parking-data:/app/data
      - parking-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - parking-net

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: parkwatch-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - parking-net

volumes:
  parking-data:
    name: parkwatch-data
  parking-logs:
    name: parkwatch-logs

networks:
  parking-net:
    name: parkwatch-network
    driver: bridge
