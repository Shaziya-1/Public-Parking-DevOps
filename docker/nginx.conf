# Nginx reverse proxy configuration for ParkWatch
# Used when running Nginx in front of the Spring Boot application container
# The Spring Boot app runs on port 8080; Nginx listens on 80

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Upstream Spring Boot application
    upstream parkwatch-backend {
        server app:8080;        # Docker service name (docker-compose) or localhost:8080
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";

        # Default proxy settings
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Proxy all requests to Spring Boot
        location / {
            proxy_pass         http://parkwatch-backend;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Static files: serve directly or proxy (Spring Boot serves them)
        location ~* \.(css|js|png|jpg|gif|ico|woff2?)$ {
            proxy_pass http://parkwatch-backend;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # Health check endpoint (used by load balancers / monitors)
        location = /health {
            proxy_pass http://parkwatch-backend/actuator/health;
            access_log off;
        }

        # Disable H2 console access through Nginx in production
        location /h2-console {
            deny all;
            return 403;
        }

        # Actuator endpoints: allow /actuator/health, block everything else
        location = /actuator/health {
            proxy_pass http://parkwatch-backend/actuator/health;
            access_log off;
        }

        location /actuator/ {
            deny all;
            return 403;
        }
    }
}
