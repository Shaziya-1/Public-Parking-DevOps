# ─── Server ───────────────────────────────────────────────────────────────────
server.port=${APP_PORT:8081}
spring.application.name=public-parking-dashboard

# ─── H2 Database (dev/default profile) ───────────────────────────────────────
spring.datasource.url=jdbc:h2:file:./data/parkingdb;AUTO_SERVER=TRUE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ─── H2 Console (for local development inspection) ───────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── Thymeleaf ────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ─── Spring Actuator ─────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.app.name=Public Parking Dashboard
management.info.app.version=1.0.0
management.info.app.student=Sajiya Shaikh
management.info.app.roll=24102A2005

# ─── Parking Configuration ────────────────────────────────────────────────────
# Low-availability threshold (% occupancy above which a location is flagged)
parking.low-availability-threshold=${LOW_AVAILABILITY_THRESHOLD:85}
# Stale data threshold in minutes
parking.stale-threshold-minutes=${STALE_THRESHOLD_MINUTES:60}
# Dashboard auto-refresh interval (seconds)
parking.dashboard-refresh-seconds=30

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.parking=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ─── Multipart & AI Parking Analysis Configuration ───────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
parking.ai.enabled=${AI_ENABLED:true}
parking.ai.python-path=${PYTHON_PATH:python}
parking.ai.model-path=${AI_MODEL_PATH:models/parkwatch_yolov8n_improved/weights/best.pt}
parking.ai.script-path=${AI_SCRIPT_PATH:scripts/ai_inference_demo.py}
parking.ai.default-conf=${AI_DEFAULT_CONF:0.25}
