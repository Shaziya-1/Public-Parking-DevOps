<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/header :: htmlHead(${pageTitle})}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">
<div th:replace="~{fragments/header :: navbar}"></div>
<main class="flex-grow-1 py-4">
<div class="container-fluid px-4">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}">Dashboard</a></li>
            <li class="breadcrumb-item active">Events - <span th:text="${location.name}"></span></li>
        </ol>
    </nav>
    <h1 class="h4 fw-bold mb-4">
        <i class="bi bi-clock-history text-primary me-2"></i>
        Parking Events: <span th:text="${location.name}"></span>
    </h1>
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(events)}" class="text-center py-5 text-muted">
                <i class="bi bi-inbox display-5"></i>
                <p class="mt-3">No events recorded yet.</p>
                <a th:href="@{/events/new(locationId=${location.id})}" class="btn btn-sm btn-outline-primary">Record First Update</a>
            </div>
            <div th:if="${!#lists.isEmpty(events)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="events-table">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-3">ID</th>
                            <th>Timestamp</th>
                            <th>Type</th>
                            <th class="text-center">Prev. Occupancy</th>
                            <th class="text-center">Reported Occupancy</th>
                            <th>Operator</th>
                            <th>Notes</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ev : ${events}">
                            <td class="ps-3 text-muted small" th:text="${ev.id}"></td>
                            <td><small th:text="${#temporals.format(ev.eventTimestamp,'dd MMM yyyy HH:mm:ss')}"></small></td>
                            <td><span class="badge bg-secondary-subtle text-secondary border" th:text="${ev.eventType}"></span></td>
                            <td class="text-center" th:text="${ev.previousOccupancy != null ? ev.previousOccupancy : '—'}"></td>
                            <td class="text-center fw-semibold" th:text="${ev.reportedOccupancy}"></td>
                            <td><small th:text="${ev.operatorName != null ? ev.operatorName : '—'}"></small></td>
                            <td><small class="text-muted" th:text="${ev.description}"></small></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</main>
<div th:replace="~{fragments/header :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmCA+GEexSqYF2JGVISMFHXtJJY"
        crossorigin="anonymous"></script>
</body>
</html>
