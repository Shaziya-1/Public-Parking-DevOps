<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/header :: htmlHead(${pageTitle})}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="flex-grow-1 py-4">
<div class="container" style="max-width: 720px;">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}">Dashboard</a></li>
            <li class="breadcrumb-item active" th:text="${pageTitle}">Location Form</li>
        </ol>
    </nav>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-primary text-white py-3">
            <h1 class="h5 mb-0 fw-bold" th:text="${pageTitle}">Location Form</h1>
        </div>
        <div class="card-body p-4">
            <form th:action="${formAction}" method="post" id="location-form"
                  th:object="${location}" novalidate>

                <!-- Error summary -->
                <div th:if="${#fields.hasAnyErrors()}"
                     class="alert alert-danger d-flex align-items-start gap-2 mb-3">
                    <i class="bi bi-exclamation-triangle-fill mt-1"></i>
                    <div>
                        <strong>Please fix the following errors:</strong>
                        <ul class="mb-0 mt-1">
                            <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
                        </ul>
                    </div>
                </div>

                <div class="row g-3">

                    <!-- Name -->
                    <div class="col-12">
                        <label for="name" class="form-label fw-semibold">
                            Parking Location Name <span class="text-danger">*</span>
                        </label>
                        <input type="text" id="name" th:field="*{name}"
                               class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                               placeholder="e.g. Bandra West Civic Plaza Parking"
                               maxlength="150" required/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}"></div>
                    </div>

                    <!-- Area and Location Code -->
                    <div class="col-md-8">
                        <label for="area" class="form-label fw-semibold">
                            Area / Locality <span class="text-danger">*</span>
                        </label>
                        <input type="text" id="area" th:field="*{area}"
                               class="form-control" th:classappend="${#fields.hasErrors('area')} ? 'is-invalid'"
                               placeholder="e.g. Bandra West"
                               maxlength="100" required/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('area')}"
                             th:errors="*{area}"></div>
                    </div>
                    <div class="col-md-4">
                        <label for="locationCode" class="form-label fw-semibold">Location Code</label>
                        <input type="text" id="locationCode" th:field="*{locationCode}"
                               class="form-control" placeholder="e.g. PPL-001"/>
                    </div>

                    <!-- Address -->
                    <div class="col-12">
                        <label for="address" class="form-label fw-semibold">Address</label>
                        <input type="text" id="address" th:field="*{address}"
                               class="form-control" placeholder="Full address including PIN code"
                               maxlength="255"/>
                    </div>

                    <!-- Capacity and Occupied -->
                    <div class="col-md-6">
                        <label for="totalCapacity" class="form-label fw-semibold">
                            Total Capacity <span class="text-danger">*</span>
                        </label>
                        <input type="number" id="totalCapacity" th:field="*{totalCapacity}"
                               class="form-control" th:classappend="${#fields.hasErrors('totalCapacity')} ? 'is-invalid'"
                               min="1" max="10000" required
                               placeholder="Maximum number of parking spaces"/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('totalCapacity')}"
                             th:errors="*{totalCapacity}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="occupiedSpaces" class="form-label fw-semibold">
                            Currently Occupied <span class="text-danger">*</span>
                        </label>
                        <input type="number" id="occupiedSpaces" th:field="*{occupiedSpaces}"
                               class="form-control" th:classappend="${#fields.hasErrors('occupiedSpaces')} ? 'is-invalid'"
                               min="0" required
                               placeholder="Current number of occupied spaces"/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('occupiedSpaces')}"
                             th:errors="*{occupiedSpaces}"></div>
                        <div class="form-text text-muted">
                            Must be 0 to the total capacity value.
                        </div>
                    </div>

                    <!-- Live availability preview -->
                    <div class="col-12" id="availability-preview-row">
                        <div class="alert alert-info py-2 mb-0" id="availability-preview">
                            <i class="bi bi-info-circle me-2"></i>
                            Available spaces: <strong id="preview-available">—</strong> &nbsp;|&nbsp;
                            Utilization: <strong id="preview-utilization">—</strong>
                        </div>
                    </div>

                    <!-- Contact Phone -->
                    <div class="col-md-6">
                        <label for="contactPhone" class="form-label fw-semibold">Contact Phone</label>
                        <input type="tel" id="contactPhone" th:field="*{contactPhone}"
                               class="form-control" placeholder="e.g. +91-22-12345678"
                               maxlength="20"/>
                    </div>

                    <!-- Description -->
                    <div class="col-12">
                        <label for="description" class="form-label fw-semibold">Description / Notes</label>
                        <textarea id="description" th:field="*{description}"
                                  class="form-control" rows="2" maxlength="500"
                                  placeholder="Optional notes about this parking location"></textarea>
                    </div>

                    <!-- Buttons -->
                    <div class="col-12 d-flex gap-2 justify-content-end border-top pt-3 mt-2">
                        <a th:href="@{/}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle me-1"></i>Cancel
                        </a>
                        <button type="submit" class="btn btn-primary" id="btn-submit-location"
                                th:text="${submitLabel}">Submit</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</main>

<div th:replace="~{fragments/header :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmCA+GEexSqYF2JGVISMFHXtJJY"
        crossorigin="anonymous"></script>
<script>
// Live availability preview
(function() {
    const capInput = document.getElementById('totalCapacity');
    const occInput = document.getElementById('occupiedSpaces');
    const previewAvail = document.getElementById('preview-available');
    const previewUtil = document.getElementById('preview-utilization');
    const previewRow = document.getElementById('availability-preview');

    function updatePreview() {
        const cap = parseInt(capInput.value) || 0;
        const occ = parseInt(occInput.value) || 0;
        if (cap > 0) {
            const avail = Math.max(0, cap - occ);
            const util = Math.min(100, (occ / cap) * 100);
            previewAvail.textContent = avail + ' spaces';
            previewUtil.textContent = util.toFixed(1) + '%';
            previewRow.className = 'alert py-2 mb-0 ' +
                (util >= 100 ? 'alert-danger' : util >= 85 ? 'alert-warning' : 'alert-success');

            // Client-side validation hint
            if (occ < 0) {
                occInput.setCustomValidity('Occupied spaces cannot be negative.');
            } else if (cap > 0 && occ > cap) {
                occInput.setCustomValidity('Occupied spaces cannot exceed capacity.');
            } else {
                occInput.setCustomValidity('');
            }
        }
    }
    capInput.addEventListener('input', updatePreview);
    occInput.addEventListener('input', updatePreview);
    updatePreview();
})();
</script>
</body>
</html>
