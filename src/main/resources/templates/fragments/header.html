<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!-- ============================================================
     FRAGMENT: header.html
     Common <head> section and navigation bar for all pages.
     ============================================================ -->
<head th:fragment="htmlHead(pageTitle)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle} + ' | Public Parking Dashboard'">Public Parking Dashboard</title>
    <meta name="description" content="Real-time public parking availability dashboard for citizens and operators."/>
    <!-- Bootstrap 5 -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"/>
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>

<body>
<!-- Navigation Bar Fragment -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid px-4">
        <!-- Brand -->
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <i class="bi bi-p-square-fill fs-4"></i>
            <div>
                <div class="fw-bold lh-1">ParkWatch</div>
                <div class="text-white-50" style="font-size:0.65rem;">Public Parking Dashboard</div>
            </div>
        </a>

        <!-- Mobile toggler -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarMain" aria-controls="navbarMain"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Nav Links -->
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" id="nav-dashboard" th:href="@{/}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="nav-locations" th:href="@{/locations/new}">
                        <i class="bi bi-plus-circle me-1"></i>Add Location
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="nav-events" th:href="@{/events/new}">
                        <i class="bi bi-pencil-square me-1"></i>Record Update
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="nav-alerts" th:href="@{/alerts}">
                        <i class="bi bi-exclamation-triangle me-1"></i>Alerts
                    </a>
                </li>
            </ul>
            <!-- Right-side badge -->
            <span class="badge bg-warning text-dark fw-semibold">
                <i class="bi bi-info-circle me-1"></i>Sample Data — Academic Project
            </span>
        </div>
    </div>
</nav>

<!-- Footer Fragment -->
<footer th:fragment="footer" class="footer mt-auto py-3 bg-dark text-white-50">
    <div class="container-fluid px-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-p-square-fill text-primary"></i>
                <small>
                    <strong class="text-white">ParkWatch</strong> &mdash;
                    DevOps-Enabled Public Parking Availability Dashboard
                </small>
            </div>
            <div>
                <small>
                    Student: <strong class="text-white">Sajiya Shaikh</strong>
                    | Roll: <strong class="text-white">24102A2005</strong>
                    | Academic Project &mdash; Sample Data Only
                </small>
            </div>
            <div>
                <small>
                    <a th:href="@{/about}" class="text-white-50 text-decoration-none me-3">About</a>
                    <a href="/h2-console" class="text-white-50 text-decoration-none me-3" target="_blank">H2 Console</a>
                    <a href="/actuator/health" class="text-white-50 text-decoration-none">Health</a>
                </small>
            </div>
        </div>
    </div>
</footer>
</body>
</html>
