# Test profile configuration - uses in-memory H2, no sample data loaded
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.h2.console.enabled=false

parking.low-availability-threshold=85
parking.stale-threshold-minutes=60
parking.dashboard-refresh-seconds=30

logging.level.com.parking=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
