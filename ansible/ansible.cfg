[defaults]
# Ansible configuration for Public Parking Dashboard
# Student: Sajiya Shaikh | Roll: 24102A2005

# Inventory file location
inventory = inventory.ini

# Output formatting
stdout_callback = default
callbacks_enabled = timer, profile_tasks

# SSH settings
host_key_checking = False
timeout = 30
remote_user = ubuntu

# Role path
roles_path = roles

# Retry files
retry_files_enabled = False

# Privilege escalation
become = True
become_method = sudo
become_ask_pass = False

# Performance
forks = 5
pipelining = True
gathering = smart

# Logging
log_path = /tmp/ansible-parking.log

[privilege_escalation]
become = True
become_method = sudo
